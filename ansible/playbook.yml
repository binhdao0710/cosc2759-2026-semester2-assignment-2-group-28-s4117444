- name: Set up Docker on all hosts
  hosts: db:backend:frontend
  become: true
  tasks:
    - name: Install Docker
      apt: { name: docker.io, state: present, update_cache: true }
    - name: Ensure Docker is running
      service: { name: docker, state: started, enabled: true }
    - name: Install Docker Python SDK
      apt: { name: python3-docker, state: present }

- name: Deploy DB container
  hosts: db
  become: true
  tasks:
    - name: Run the DB container
      community.docker.docker_container:
        name: db
        image: liamrmit/sdo-2026:db
        image_name_mismatch: recreate
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: "{{ db_user }}"
          POSTGRES_PASSWORD: "{{ db_password }}"
          POSTGRES_DB: "posts"

- name: Deploy Backend container
  hosts: backend
  become: true
  tasks:
    - name: Run the Backend container
      community.docker.docker_container:
        name: backend
        image: liamrmit/sdo-2026:backend
        image_name_mismatch: recreate
        ports:
          - "8080:8080"
        env:
          PORT: "8080"
          DB_USER: "{{ db_user }}"
          DB_PASSWORD: "{{ db_password }}"
          DB_HOST: "{{ db_host }}"

- name: Deploy Frontend container
  hosts: frontend
  become: true
  tasks:
    - name: Run the Frontend container
      community.docker.docker_container:
        name: frontend
        image: liamrmit/sdo-2026:frontend
        image_name_mismatch: recreate
        ports:
          - "8081:8081"
        env:
          PORT: "8081"
          BACKEND_URL: "{{ backend_url }}"
